[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mypet-life-mcp"
version = "0.1.0"
description = "PlayMCP-ready remote MCP server for Korean pet owner lifestyle use cases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0,<2",
]

[project.optional-dependencies]
test = []

[project.scripts]
mypet-life-mcp = "mypet_life_mcp.server:main"

[tool.setuptools.packages.find]
include = ["mypet_life_mcp*"]
